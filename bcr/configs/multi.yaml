data:
  fold_dir: "/data/pathology/projects/clement/leopard/csvs/folds/4-bins"

output_dir: "output/dctm"

num_classes: 4 # number of bins
label_name: "label"

metrics: # list of metrics to compute
 - "c-index"

fm: "uni"
features_dim: 1024
features_dir: "/root/${fm}-features"

model:
  level: "local"
  batch_size: 1
  dropout: 0.25
  region_size: 2048
  patch_size: 256
  embed_dim_patch: ${features_dim}
  embed_dim_region: 192
  embed_dim_slide: 192
  mask_attn: False

dctm:
  enable: false
  variant: "shift"
  basis_features: 6
  family: "logistic"
  evaluation:
    horizon_quantiles: [0.25, 0.5, 0.75, 1.0]
    horizon_source: "train_events"
    compute_ibs: true
    ibs_num_times: 100
    risk_alias_quantile: 1.0

training:
  nepochs: 100
  batch_size: 1
  gradient_accumulation: 32

tuning:
  batch_size: 1
  tune_every: 1

testing:
  retrieve_checkpoint: "best"

optim:
  name: "adam"
  lr: 0.0002
  wd: 1e-5
  lr_scheduler:
    name: "step"
    step_size: 20
    gamma: 0.5

early_stopping:
  enable: true
  tracking: "loss"
  min_max: "min"
  patience: 20
  min_epoch: 40
  save_all: false

speed:
  num_workers: 8

wandb:
  enable: true
  project: "leopard"
  username: "clemsg"
  exp_name: "survival-multi"
  tags: ["${model.level}", "${model.region_size}", "${fm}"]
